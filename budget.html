<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Budget | Budgets</title>

<meta
  name="description"
  content="Smart Budget — Manage your monthly budgets."
>

<style>

:root{
  --bg:#f5f3ee;
  --surface:#ffffff;
  --surface-soft:#f8f7f3;
  --text:#20221f;
  --muted:#777b75;
  --line:#e8e5de;

  --green:#537965;
  --green-dark:#405f50;
  --red:#a55f5b;
  --gold:#a2855d;

  --icon-bg:#f2f0ea;
  --progress:#e9e6df;

  --shadow:0 12px 35px rgba(32,34,31,.06);
}

body.dark{
  --bg:#151715;
  --surface:#20231f;
  --surface-soft:#292c28;
  --text:#f3f2ed;
  --muted:#a5a8a2;
  --line:#343832;

  --icon-bg:#2b2e2a;
  --progress:#383c38;

  --shadow:0 12px 35px rgba(0,0,0,.20);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:var(--bg);
  color:var(--text);

  min-height:100vh;

  transition:
    background .25s ease,
    color .25s ease;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:30px 20px 100px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:28px;
}

.brand h1{
  font-size:29px;
  letter-spacing:-.6px;
}

.brand p{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}

.add-budget-btn{
  border:none;
  background:#20221f;
  color:white;
  padding:13px 18px;
  border-radius:13px;
  font-weight:600;
}

body.dark .add-budget-btn{
  background:#537965;
}

/* SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:16px;
  margin-bottom:24px;
}

.summary-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:21px;
  box-shadow:var(--shadow);
}

.summary-label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}

.summary-value{
  font-size:27px;
  font-weight:700;
}

.summary-value.budget{
  color:var(--green);
}

.summary-value.spent{
  color:var(--red);
}

.summary-value.remaining{
  color:var(--gold);
}

/* MAIN */

.section{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px;
  box-shadow:var(--shadow);
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.section-title{
  font-size:19px;
  font-weight:700;
}

.section-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

/* BUDGET LIST */

.budget-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.budget-item{
  border:1px solid var(--line);
  border-radius:17px;
  padding:18px;
  background:var(--surface-soft);
}

.budget-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.budget-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.budget-icon{
  width:44px;
  height:44px;
  border-radius:13px;
  background:var(--icon-bg);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  flex-shrink:0;
}

.budget-name{
  font-size:15px;
  font-weight:700;
}

.budget-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.budget-actions{
  display:flex;
  gap:7px;
}

.small-btn{
  width:35px;
  height:35px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  font-size:14px;
}

.small-btn.delete{
  color:var(--red);
}

.budget-numbers{
  display:flex;
  justify-content:space-between;
  margin-top:17px;
  font-size:13px;
}

.spent-text{
  color:var(--red);
}

.remaining-text{
  color:var(--green);
}

.progress-track{
  height:9px;
  background:var(--progress);
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress-bar{
  height:100%;
  background:var(--green);
  border-radius:20px;
  transition:.3s;
}

.progress-bar.warning{
  background:var(--gold);
}

.progress-bar.danger{
  background:var(--red);
}

.empty-state{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:42px;
  margin-bottom:13px;
}

.empty-title{
  color:var(--text);
  font-weight:700;
  margin-bottom:7px;
}

/* MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;
  z-index:2000;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:460px;

  background:var(--surface);
  border:1px solid var(--line);
  border-radius:24px;

  padding:24px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modal-title{
  font-size:20px;
  font-weight:700;
}

.close-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--surface-soft);
  color:var(--text);
  font-size:20px;
}

.form-group{
  margin-bottom:16px;
}

.form-label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

.form-input,
.form-select{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface-soft);
  color:var(--text);

  padding:13px 14px;

  border-radius:12px;
  outline:none;

  font-size:14px;
}

.form-input:focus,
.form-select:focus{
  border-color:var(--green);
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.cancel-btn,
.save-btn{
  flex:1;
  padding:13px;
  border-radius:12px;
  font-weight:600;
}

.cancel-btn{
  background:var(--surface-soft);
  border:1px solid var(--line);
  color:var(--text);
}

.save-btn{
  background:var(--green);
  border:none;
  color:white;
}

/* NAV */

.mobile-nav{
  position:fixed;
  display:flex;

  left:0;
  right:0;
  bottom:0;

  height:72px;

  background:#20221f;

  z-index:1000;

  justify-content:space-around;
  align-items:center;

  padding:0 8px;
}

.nav-item{
  color:#aaa;
  text-decoration:none;

  font-size:10px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:5px;

  min-width:55px;
}

.nav-item.active{
  color:white;
}

.nav-icon{
  font-size:19px;
}

.nav-add{
  width:48px;
  height:48px;

  border-radius:50%;

  background:#537965;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;

  margin-top:-24px;

  border:4px solid var(--bg);
}

/* DESKTOP NAV */

.desktop-back{
  display:none;
}

/* MOBILE */

@media(max-width:700px){

  .app{
    padding:
      20px
      15px
      95px;
  }

  .header{
    align-items:flex-start;
  }

  .brand h1{
    font-size:24px;
  }

  .brand p{
    font-size:12px;
  }

  .add-budget-btn{
    padding:10px 12px;
    font-size:12px;
  }

  .summary-grid{
    grid-template-columns:
      repeat(2,1fr);

    gap:12px;
  }

  .summary-card{
    padding:17px;
    border-radius:17px;
  }

  .summary-value{
    font-size:21px;
  }

  .summary-label{
    font-size:11px;
  }

  .summary-grid
  .summary-card:last-child{
    grid-column:
      1 / -1;
  }

  .section{
    padding:18px;
    border-radius:18px;
  }

  .budget-item{
    padding:15px;
  }

  .budget-top{
    align-items:flex-start;
  }

  .budget-icon{
    width:40px;
    height:40px;
  }

  .budget-name{
    font-size:14px;
  }

  .budget-actions{
    gap:5px;
  }

  .small-btn{
    width:32px;
    height:32px;
  }

  .modal{
    padding:20px;
  }

}

/* HIDE NAV ON VERY WIDE */

@media(min-width:761px){

  .mobile-nav{
    display:flex;
  }

}

</style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <h1>
        Budgets
      </h1>

      <p>
        Plan your spending and stay in control.
      </p>

    </div>

    <button
      class="add-budget-btn"
      onclick="openBudgetModal()"
    >
      + Add Budget
    </button>

  </header>


  <!-- SUMMARY -->

  <section class="summary-grid">

    <div class="summary-card">

      <div class="summary-label">
        Total Budget

      <div

        id="totalBudget"
      >
        $0.00
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Total Spent
      </div>

      <div
        class="summary-value spent"
        id="totalSpent"
      >
        $0.00
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">

      </div>

      <div
        class="summary-value remaining"
        id="totalRemaining"
      >
        $0.00
      </div>

    </div>

  </section>


  <!-- BUDGETS -->

  <section class="section">

    <div class="section-header">

      <div>

        <div class="section-title">

        </div>

        <div class="section-subtitle">
          Track how much you're spending in each category.
        </div>

      </div>

    </div>


    <div
      class="budget-list"
      id="budgetList"
    ></div>

  </section>

</div>


<!-- MOBILE NAV -->

<nav class="mobile-nav">

  <a
    class="nav-item"
    href="index.html"
  >
    <div class="nav-icon">
      ⌂
    </div>

    <div>
      Home
    </div>

  </a>


  <a
    class="nav-item"
    href="transactions.html"
  >
    <div class="nav-icon">
      ≡
    </div>

    <div>
      Activity
    </div>

  </a>


  <a
    class="nav-item"
    href="transactions.html"
  >
    <div class="nav-add">
      +
    </div>
  </a>


  <a
    class="nav-item"
    href="goals.html"
  >
    <div class="nav-icon">
      ◇
    </div>

    <div>
      Goals
    </div>

  </a>


  <a
    class="nav-item active"
    href="budget.html"
  >
    <div class="nav-icon">
      ▣
    </div>

    <div>
      Budget
    </div>

  </a>

</nav>


<!-- MODAL -->

<div
  class="modal-overlay"
  id="modalOverlay"
>

  <div class="modal">

    <div class="modal-header">

      <div
        class="modal-title"
        id="modalTitle"
      >
        Add Budget
      </div>

      <button
        class="close-btn"
        onclick="closeBudgetModal()"
      >
        ×
      </button>

    </div>


    <div class="form-group">

      <label class="form-label">
        Category
      </label>

      <select
        class="form-select"
        id="category"
      >

        <option value="Food">
          🍔 Food
        </option>

        <option value="Shopping">
          🛍️ Shopping
        </option>

        <option value="Transport">
          🚗 Transport
        </option>

        <option value="Bills">
          🧾 Bills
        </option>

        <option value="Entertainment">
          🎬 Entertainment
        </option>

        <option value="Health">
          ❤️ Health
        </option>

        <option value="Education">
          📚 Education
        </option>

        <option value="Home">
          🏠 Home
        </option>

        <option value="Other">
          📦 Other
        </option>

      </select>

    </div>


    <div class="form-group">

      <label class="form-label">
        Monthly Budget
      </label>

      <input
        type="number"

        placeholder="Enter budget amount"
        min="0"
        step="0.01"
      >

    </div>


    <div class="form-actions">

      <button
        class="cancel-btn"
        onclick="closeBudgetModal()"
      >
        Cancel
      </button>

        onclick="saveBudget()"
      >
        Save Budget
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const defaultSettings = {
  name:"",
  currency:"USD",
  notifications:true,
  theme:"light"
};


const currencySymbols = {

  USD:"$",
  EUR:"€",
  GBP:"£",
  EGP:"E£",

  SAR:"﷼",
  AED:"د.إ",
  QAR:"﷼",
  KWD:"د.ك",
  BHD:".د.ب",
  OMR:"﷼",
  JOD:"د.ا",

  CAD:"C$",
  AUD:"A$",
  NZD:"NZ$",
  CHF:"CHF",

  JPY:"¥",
  CNY:"¥",
  HKD:"HK$",
  SGD:"S$",
  KRW:"₩",

  INR:"₹",
  PKR:"₨",
  BDT:"৳",

  TRY:"₺",
  RUB:"₽",
  UAH:"₴",

  BRL:"R$",
  MXN:"Mex$",
  ARS:"$",
  CLP:"$",

  ZAR:"R",
  NGN:"₦",
  KES:"KSh",
  GHS:"₵",

  MAD:"د.م.",
  DZD:"دج",
  TND:"د.ت",
  LYD:"ل.د",
  IQD:"ع.د",

  SEK:"kr",
  NOK:"kr",
  DKK:"kr",
  PLN:"zł",
  CZK:"Kč"

};


function getSettings(){

  try{

    const saved =
      localStorage.getItem(
        "smartBudgetSettings"
      );

    if(saved){

      return {
        ...defaultSettings,
        ...JSON.parse(saved)
      };

    }

  }catch(error){}

  return {
    ...defaultSettings
  };

}


function getCurrencySymbol(){

  const settings =
    getSettings();

  return (
    currencySymbols[
      settings.currency
    ] || "$"
  );

}


function formatMoney(amount){

  return (
    getCurrencySymbol()
  ) +
  Number(
    amount || 0
  ).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* =========================
   THEME
========================= */

function applyTheme(){

  const settings =
    getSettings();

  document.body.classList.toggle(
    "dark",
    settings.theme === "dark"
  );

}


/* =========================
   DATA
========================= */

function getBudgets(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "smartBudgetBudgets"
        )
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


function saveBudgets(
  budgets
){

  localStorage.setItem(
    "smartBudgetBudgets",
    JSON.stringify(
      budgets
    )
  );

}


function getTransactions(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "smartBudgetTransactions"
        )
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


/* =========================
   CATEGORY ICONS
========================= */

const categoryIcons = {

  Food:"🍔",
  Shopping:"🛍️",
  Transport:"🚗",
  Bills:"🧾",
  Entertainment:"🎬",
  Health:"❤️",
  Education:"📚",
  Home:"🏠",
  Other:"📦"

};


/* =========================
   SPENDING
========================= */

function getCategorySpent(
  category
){

  const transactions =
    getTransactions();

  return transactions
    .filter(
      transaction =>
        transaction.type !==
        "income" &&
        transaction.category ===
        category
    )
    .reduce(
      (total,transaction) =>
        total +
        (
          Number(
            transaction.amount
          ) || 0
        ),
      0
    );

}


/* =========================
   RENDER
========================= */

function renderBudgets(){

  const budgets =
    getBudgets();

  const container =
    document.getElementById(
      "budgetList"
    );


  let totalBudget = 0;

  let totalSpent = 0;


  budgets.forEach(
    budget => {

      const amount =
        Number(
          budget.amount
        ) || 0;

      const spent =
        getCategorySpent(
          budget.category
        );

      totalBudget +=
        amount;

      totalSpent +=
        spent;

    }
  );


  const remaining =
    totalBudget -
    totalSpent;


  document.getElementById(
    "totalBudget"
  ).textContent =
    formatMoney(
      totalBudget
    );


  document.getElementById(
    "totalSpent"
  ).textContent =
    formatMoney(
      totalSpent
    );


  document.getElementById(
    "totalRemaining"
  ).textContent =
    formatMoney(
      remaining
    );


  if(
    budgets.length === 0
  ){

    container.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">
          🎯
        </div>

        <div class="empty-title">
          No budgets yet
        </div>

        <div>
          Create your first monthly budget
          to start controlling your spending.
        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    budgets.map(
      budget => {

        const budgetAmount =
          Number(
            budget.amount
          ) || 0;


        const spent =
          getCategorySpent(
            budget.category
          );


        const remainingAmount =
          budgetAmount -
          spent;


        const percent =
          budgetAmount > 0
            ? Math.round(
                (
                  spent /
                  budgetAmount
                ) * 100
              )
            : 0;


        const width =
          Math.min(
            percent,
            100
          );


        let progressClass =
          "";


        if(
          percent >= 100
        ){

          progressClass =
            "danger";

        }else if(
          percent >= 75
        ){

          progressClass =
            "warning";

        }


        const icon =
          categoryIcons[
            budget.category
          ] || "📦";


        return `

          <div class="budget-item">

            <div class="budget-top">

              <div class="budget-left">

                <div class="budget-icon">
                  ${icon}
                </div>

                <div>

                  <div class="budget-name">
                    ${escapeHTML(
                      budget.category
                    )}
                  </div>

                  <div class="budget-meta">
                    Budget:
                    ${formatMoney(
                      budgetAmount
                    )}
                  </div>

                </div>

              </div>


              <div class="budget-actions">

                <button
                  class="small-btn"
                  onclick="editBudget(${budget.id})"
                >
                  ✎
                </button>

                <button
                  class="small-btn delete"
                  onclick="deleteBudget(${budget.id})"
                >
                  ×
                </button>

              </div>

            </div>


            <div class="budget-numbers">

              <span class="spent-text">
                Spent:
                ${formatMoney(
                  spent
                )}
              </span>

              <span class="remaining-text">

                ${
                  remainingAmount >= 0
                    ? "Remaining: " +
                      formatMoney(
                        remainingAmount
                      )
                    : "Over by: " +
                      formatMoney(
                        Math.abs(
                          remainingAmount
                        )
                      )
                }

              </span>

            </div>


            <div class="progress-track">

              <div
                class="progress-bar ${progressClass}"
                style="
                  width:${width}%;
                "
              ></div>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================
   MODAL
========================= */

let editingId = null;


function openBudgetModal(
  id = null
){

  editingId = id;


  const modal =
    document.getElementById(
      "modalOverlay"
    );


  const title =
    document.getElementById(
      "modalTitle"
    );


  const category =
    document.getElementById(
      "category"
    );


  const amount =
    document.getElementById(
      "amount"
    );


  if(
    id !== null
  ){

    const budgets =
      getBudgets();

    const budget =
      budgets.find(
        item =>
          item.id === id
      );


    if(!budget){
      return;
    }


    title.textContent =
      "Edit Budget";


    category.value =
      budget.category;


    amount.value =
      budget.amount;

  }else{

    title.textContent =
      "Add Budget";


    category.value =
      "Food";


    amount.value =
      "";

  }


  modal.classList.add(
    "show"
  );


  setTimeout(
    () =>
      amount.focus(),
    100
  );

}


function closeBudgetModal(){

  document.getElementById(
    "modalOverlay"
  ).classList.remove(
    "show"
  );

  editingId = null;

}


/* =========================
   SAVE
========================= */

function saveBudget(){

  const category =
    document.getElementById(
      "category"
    ).value;


  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  if(
    !amount ||
    amount <= 0
  ){

    alert(
      "Please enter a valid budget amount."
    );

    return;

  }


  let budgets =
    getBudgets();


  /*
    Prevent duplicate categories
    when creating a new budget.
  */

  if(
    editingId === null
  ){

    const existing =
      budgets.find(
        budget =>
          budget.category ===
          category
      );


    if(existing){

      alert(
        "A budget for this category already exists."
      );

      return;

    }


    budgets.push({

      id:
        Date.now(),

      category:
        category,

      amount:
        amount

    });

  }else{

    const index =
      budgets.findIndex(
        budget =>
          budget.id ===
          editingId
      );


    if(
      index !== -1
    ){

      budgets[index].category =
        category;

      budgets[index].amount =
        amount;

    }

  }


  saveBudgets(
    budgets
  );


  closeBudgetModal();

  renderBudgets();

}


/* =========================
   EDIT
========================= */

function editBudget(
  id
){

  openBudgetModal(
    id
  );

}


/* =========================
   DELETE
========================= */

function deleteBudget(
  id
){

  const confirmed =
    confirm(
      "Delete this budget?"
    );


  if(!confirmed){
    return;
  }


  const budgets =
    getBudgets()
      .filter(
        budget =>
          budget.id !== id
      );


  saveBudgets(
    budgets
  );


  renderBudgets();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

document
  .getElementById(
    "modalOverlay"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        this
      ){

        closeBudgetModal();

      }

    }
  );


/* =========================
   INIT
========================= */

function init(){

  applyTheme();

  renderBudgets();

}


window.addEventListener(
  "pageshow",
  function(){

    applyTheme();

    renderBudgets();

  }
);


init();

</script>
